[project]
name = "text-mining-labs"
version = "0.1.0"
description = "LTU D7058E Text Mining labs"
readme = "README.md"
authors = [
    { name = "notPlancha", email = "31565873+notPlancha@users.noreply.github.com" }
]
dependencies = [
    "ipykernel>=7.4.0",
    "kagglehub<1.0.3",
    "nltk>=3.10.4",
    "pandas>=3.1.1",
    "spacy>=3.8.18",
    "en-core-web-sm",
    "sv-core-news-sm",
    "tqdm>=4.70.1",
]
requires-python = ">=3.15"

[dependency-groups]
dev = [
    "ruff>=0.17.6",
    "ty>=0.0.109",
]

[tool.ruff]
target-version = "py315"
extend-exclude = ["docs/**"]
indent-width = 2

[tool.ruff.lint.per-file-ignores]
"src/**/*.ipynb" = ["F401"]

[tool.uv.sources]
sv-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/sv_core_news_sm-3.8.0/sv_core_news_sm-3.8.0-py3-none-any.whl" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
