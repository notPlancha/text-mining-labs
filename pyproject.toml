[project]
name = "text-mining-labs"
version = "0.1.0"
description = "LTU D7058E Text Mining labs"
readme = "README.md"
authors = [
    { name = "notPlancha", email = "31565873+notPlancha@users.noreply.github.com" }
]
dependencies = [
    "ipykernel>=7.4.0",
    "nltk>=3.10.4",
    "pandas>=3.1.1",
    "spacy>=3.8.18",
]
requires-python = ">=3.15"

[dependency-groups]
dev = [
    "ruff>=0.17.6",
    "ty>=0.0.109",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["docs/**"]
indent-width = 2

[tool.ruff.lint.per-file-ignores]
"src/**/*.ipynb" = ["F401"]
