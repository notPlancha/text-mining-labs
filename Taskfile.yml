version: '3'

tasks:
  default:
    desc: "List available tasks"
    cmds:
      - task --list
    silent: true


  check:
    desc: "Run lint, formatting check, and ty type check"
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run ty check

  setup:
    desc: "Install dependencies and setup environment"
    cmds:
      - uv sync